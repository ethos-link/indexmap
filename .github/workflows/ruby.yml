name: Verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    uses: ethos-link/ethos-gemkit/.github/workflows/consumer.yml@06621835e5455ac550226e39be279ddbd24a918e # v0.3.0
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: indexmap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUNDLE_GEMFILE: gemfiles/integration.gemfile
      INDEXMAP_DATABASE_URL: postgresql://postgres@localhost:5432/indexmap_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "4.0.9"
          bundler: "4.0.11"
          bundler-cache: true
      - name: Verify Active Storage and both job backends
        run: bundle exec ruby script/integration
